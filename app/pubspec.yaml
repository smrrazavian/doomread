name: doomread
description: "Doomscroll later. Doomread now."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  doomread_core:
    path: ../packages/core
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  http: ^1.6.0
  intl: ^0.20.3
  provider: ^6.1.5+1

dev_dependencies:
  build_runner: ^2.16.1
  # The real server, in memory, for tests of sync between two devices.
  doomread_server:
    path: ../server
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  shelf: ^1.4.3
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: VazirmatnUI
      fonts:
        - asset: assets/fonts/Vazirmatn-UI-Regular.ttf
        - asset: assets/fonts/Vazirmatn-UI-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-UI-Bold.ttf
          weight: 700

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write # publish the dev image to GHCR when the Dockerfile changes

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The image is tagged by the Dockerfile's hash, exactly as tool/dev tags it,
      # so CI and local development run the very same image.
      - name: Image tag
        run: |
          tag=$(sha256sum tool/Dockerfile | cut -c1-12)
          echo "REMOTE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/doomread-dev:$tag" >> "$GITHUB_ENV"
          echo "DOOMREAD_IMAGE=doomread-dev:$tag" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the dev image, or build and publish it
        run: |
          if docker pull "$REMOTE_IMAGE"; then
            docker tag "$REMOTE_IMAGE" "$DOOMREAD_IMAGE"
          else
            tool/fetch-sdk.sh
            docker build -t "$DOOMREAD_IMAGE" -t "$REMOTE_IMAGE" -f tool/Dockerfile tool
            if [ "${{ github.event_name }}" = push ]; then docker push "$REMOTE_IMAGE"; fi
          fi

      # The image runs as uid 1000; hand it the checkout.
      - run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Analyze
        run: tool/dev sh -c 'flutter pub get && dart analyze packages/core && cd app && flutter analyze'

      - name: Test
        run: tool/dev sh -c 'cd app && flutter test'

      - name: Build all flavours
        run: tool/dev sh -c 'cd app && for f in apk play bazaar; do flutter build apk --debug --flavor $f || exit 1; done'

      - name: Golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/**/failures/
